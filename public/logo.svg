<svg width="168" height="40" viewBox="0 0 168 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CostoBot">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: rounded square -->
  <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>

  <!-- Robot head -->
  <rect x="8" y="11" width="24" height="17" rx="4" fill="white" fill-opacity="0.92"/>

  <!-- Robot eyes -->
  <circle cx="15" cy="18.5" r="2.5" fill="#4f46e5"/>
  <circle cx="25" cy="18.5" r="2.5" fill="#4f46e5"/>

  <!-- Robot mouth -->
  <rect x="14" y="24" width="12" height="2" rx="1" fill="#4f46e5"/>

  <!-- Antenna -->
  <line x1="20" y1="11" x2="20" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="4.5" r="2" fill="white"/>

  <!-- Dollar sign overlay (costo hint) -->
  <text x="10.5" y="21.5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#4f46e5" opacity="0.18" text-anchor="middle">$</text>

  <!-- Wordmark: CostoBot -->
  <text x="52" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.3">Costo</text>
  <text x="104.5" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#4f46e5" letter-spacing="-0.3">Bot</text>
</svg>
